# Единственное место, где живёт конфигурация препроцессинга.
# Правится ЗДЕСЬ, а не в коде: в src/ не должно быть ни имени модели,
# ни длин, ни порогов.
model:
  name: "Qwen/Qwen3-0.6B"
  # Qwen3 без этого флага ждёт от модели <think>-блок, и тогда шаблон
  # инференса перестаёт быть префиксом шаблона обучения. См. docs/tokenize_report.md.
  enable_thinking: false

data:
  # Датасет курса (CC-BY-4.0), лежит вне проекта — под DVC, не в git.
  source_train: "../../datasets/nmo/sft_single/train/0000.parquet"
  source_val: "../../datasets/nmo/sft_single/validation/0000.parquet"
  train_jsonl: "data/train.jsonl"
  val_jsonl: "data/val.jsonl"
  out_dir: "data/tokenized"

# Вход стадии — выход split из ДЗ 3 (scripts/from_hw3.py, `make data`).
# Групповой сплит по topic; доли — накопленные цели, группы по убыванию размера.
hw3:
  split_dir: "../../mlops26-hw3/hw3-broken/data"
  ratios:
    train: 0.8
    val: 0.1
    test: 0.1

sample:
  train_size: 500
  val_size: 100
  scan_rows: 20000          # сколько строк parquet просматриваем перед выборкой
  seed: 42

tokenize:
  # По хвосту распределения моего датасета (Qwen3-0.6B, docs/tokenize_report.md):
  # p99 train 220, p99 val 253, max 274. 232 резал 1.6% val — концы ответов.
  # 256 >= p99 обоих сплитов; с динамическим паддингом лишние позиции
  # оплачивают только редкие длинные примеры, а не каждый батч.
  max_seq_len: 256
  truncated_warn_ratio: 0.05
  padding_side: "left"

packing:
  enabled: true
  batch_size: 8             # для пересчёта выигрыша в шагах оптимизатора

train_estimate:
  epochs: 3
  # 12.15 ток/с — мой замер ДЗ 1 (docs/bench.json: AMD Ryzen 7 5700U, CPU,
  # bf16, Qwen3-0.6B, ГЕНЕРАЦИЯ). Обучение медленнее: forward + backward +
  # optimizer. Реальное число подставляется сюда после первого прогона ДЗ 5.
  tokens_per_sec: 12.15
